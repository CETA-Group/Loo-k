<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loo-k — Settings</title>
    <link rel="icon" type="image/png" href="../icon.png" />
    <script src="../shared/theme.js"></script>
    <link rel="stylesheet" href="../shared/theme.css" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        nav {
            position: sticky; top: 0; z-index: 10;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 1.6rem; height: 60px;
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--bdr);
        }
        .brand { font-size: 24px; font-weight: 600; letter-spacing: 0.5px; color: var(--brand); text-decoration: none; }
        .nav-back { font-size: 0.85rem; color: var(--muted); text-decoration: none; }
        .nav-back:hover { color: var(--accent); }

        .wrap { max-width: 640px; margin: 0 auto; padding: 2.5rem 1.6rem 4rem; }
        h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.4rem; }
        .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }

        .section-label {
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
            color: var(--muted); margin-bottom: 0.9rem;
        }

        .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .theme-card {
            border: 2px solid var(--bdr); border-radius: 16px;
            background: var(--card); padding: 1rem; cursor: pointer; text-align: left;
            transition: border-color 0.15s, transform 0.1s;
        }
        .theme-card:hover { transform: translateY(-2px); }
        .theme-card.active { border-color: var(--accent); }
        .swatch { height: 64px; border-radius: 10px; margin-bottom: 0.75rem; display: flex; align-items: center; padding: 0 0.7rem; gap: 0.4rem; }
        .swatch .dot { width: 14px; height: 14px; border-radius: 50%; }
        .swatch-green { background: #f8f8f6; border: 1px solid #dfe5df; }
        .swatch-dark  { background: linear-gradient(135deg,#07111e,#0d1f38); }
        .theme-name { font-size: 0.95rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
        .theme-desc { font-size: 0.78rem; color: var(--muted); margin-top: 0.2rem; }
        .badge { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
                 background: var(--accent-soft); color: var(--accent); padding: 0.15rem 0.45rem; border-radius: 6px; }
        .check { margin-left: auto; color: var(--accent); opacity: 0; font-weight: 700; }
        .theme-card.active .check { opacity: 1; }
    </style>
</head>
<body>
    <nav>
        <a class="brand" href="../main/index.html">Loo-K</a>
        <a class="nav-back" href="../main/index.html">← Back</a>
    </nav>

    <div class="wrap">
        <h1>Settings</h1>
        <p class="sub">Customize how Loo-k looks across the site.</p>

        <div class="section-label">Appearance</div>
        <div class="theme-grid">
            <button class="theme-card" data-theme-value="light">
                <div class="swatch swatch-green">
                    <span class="dot" style="background:#557755"></span>
                    <span class="dot" style="background:#a7afa7"></span>
                    <span class="dot" style="background:#eef1ec"></span>
                </div>
                <div class="theme-name">Loo-K Green <span class="badge">Default</span><span class="check">✓</span></div>
                <div class="theme-desc">Soft green &amp; warm beige. Minimal and calm.</div>
            </button>

            <button class="theme-card" data-theme-value="dark">
                <div class="swatch swatch-dark">
                    <span class="dot" style="background:#60a5fa"></span>
                    <span class="dot" style="background:#c084fc"></span>
                    <span class="dot" style="background:#e8f0ff"></span>
                </div>
                <div class="theme-name">Classic Dark<span class="check">✓</span></div>
                <div class="theme-desc">The original navy / dark interface.</div>
            </button>
        </div>
    </div>

    <script>
        var cards = document.querySelectorAll('.theme-card');
        function sync() {
            var cur = window.LookTheme.get();
            cards.forEach(function (c) {
                c.classList.toggle('active', c.dataset.themeValue === cur);
            });
        }
        cards.forEach(function (c) {
            c.addEventListener('click', function () {
                window.LookTheme.set(c.dataset.themeValue);
                sync();
            });
        });
        sync();
    </script>
</body>
</html>
